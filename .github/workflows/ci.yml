name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run tests
        run: ./gradlew test
        working-directory: java-api

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python-ai
      - name: Run tests
        run: pytest
        working-directory: python-ai

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-java, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/zjimmm/ai-document-analyzer-frontend:latest
            ghcr.io/zjimmm/ai-document-analyzer-frontend:${{ github.sha }}
      - name: Build and push java-api
        uses: docker/build-push-action@v5
        with:
          context: ./java-api
          push: true
          tags: |
            ghcr.io/zjimmm/ai-document-analyzer-java-api:latest
            ghcr.io/zjimmm/ai-document-analyzer-java-api:${{ github.sha }}
      - name: Build and push python-ai
        uses: docker/build-push-action@v5
        with:
          context: ./python-ai
          push: true
          tags: |
            ghcr.io/zjimmm/ai-document-analyzer-python-ai:latest
            ghcr.io/zjimmm/ai-document-analyzer-python-ai:${{ github.sha }}
