spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/documentdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

python-ai:
  base-url: ${PYTHON_AI_URL:http://localhost:8000}
  timeout-seconds: 60

notification-service:
  base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8001}

export-service:
  base-url: ${EXPORT_SERVICE_URL:http://localhost:8002}
